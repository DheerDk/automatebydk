version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chatflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: chatflow_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/chatflow?schema=public"
      JWT_SECRET: "chatflow_production_secure_jwt_secret_key_2025"
      JWT_REFRESH_SECRET: "chatflow_production_secure_refresh_key_2025"
      META_GRAPH_API_VERSION: "v21.0"
      MOCK_WHATSAPP: "false"
      MOCK_AI: "false"
      USE_REDIS: "true"
      REDIS_URL: "redis://redis:6379"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: chatflow_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
